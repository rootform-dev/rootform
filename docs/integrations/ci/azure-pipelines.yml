trigger:
  - main

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self
    persistCredentials: false
  - bash: |
      set -eu
      terraform -chdir=infra init -input=false
      terraform -chdir=infra plan -input=false -out="$(Agent.TempDirectory)/plan.tfplan"
      terraform -chdir=infra show -json "$(Agent.TempDirectory)/plan.tfplan" > "$(Agent.TempDirectory)/plan.json"
      ROOTFORM_PROJECT=./infra ROOTFORM_INPUT="$(Agent.TempDirectory)/plan.json" ROOTFORM_PLAN_FILE="$(Agent.TempDirectory)/plan.tfplan" ROOTFORM_OUTPUT_DIR="$(Build.SourcesDirectory)/.rootform-ci-$(Build.BuildId)" sh ./ci/rootform-ci.sh
    displayName: Analyze plan
  - publish: $(Build.SourcesDirectory)/.rootform-ci-$(Build.BuildId)
    artifact: rootform-results
    condition: succeededOrFailed()
