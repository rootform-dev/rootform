name: candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Rootform candidate version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: candidate examples
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact official dialects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rootform-dev/dialects
          ref: 2f4715ac078d532b4d9ae05f095ce705c74ad655
          path: build/dialects
          token: ${{ secrets.ROOTFORM_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install verified candidate
        id: rootform
        uses: rootform-dev/action/setup@f9049e72e6482a0f0508e5f8194aa31f5612f85b
        with:
          github-token: ${{ github.token }}
          version: ${{ inputs.version }}

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Resolve installed binary
        run: printf 'ROOTFORM_BIN=%s\n' "$(command -v rootform)" >> "$GITHUB_ENV"

      - name: Verify contracts and examples
        env:
          ROOTFORM_DIALECTS_DIR: ${{ github.workspace }}/build/dialects
        run: bun run verify
