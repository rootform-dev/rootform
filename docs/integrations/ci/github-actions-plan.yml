name: Rootform plan review

on: [pull_request]

permissions:
  contents: read

jobs:
  plan-review:
    runs-on: ubuntu-24.04
    env:
      ROOTFORM_OUTPUT_DIR: .rootform-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: rootform-dev/action/setup@71eef759bff5e73b27489b1f7de818a4a76dc2e9
        with:
          version: 0.1.0
      # Terraform or OpenTofu produces the plan. Give this step the backend and
      # provider credentials it needs; Rootform never receives them.
      - name: Plan and export
        working-directory: infra
        run: |
          terraform init -input=false
          terraform plan -input=false -out="$RUNNER_TEMP/tfplan"
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/tfplan.json"
      # Rootform reads the completed export only. It runs no Terraform command.
      # Remove ROOTFORM_POLICY_PACK when infra/rootform.lock selects the pack.
      # Remove ROOTFORM_CHECK and ROOTFORM_POLICY_PACK to keep the Architecture
      # Diff informational.
      - name: Compare and check the planned architecture
        env:
          ROOTFORM_PROJECT: ./infra
          ROOTFORM_PLAN: ${{ runner.temp }}/tfplan.json
          ROOTFORM_CHECK: "1"
          ROOTFORM_POLICY_PACK: ./policies
        run: sh ./ci/rootform-ci.sh
      - name: Keep Rootform results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootform-plan-results
          path: |
            ${{ env.ROOTFORM_OUTPUT_DIR }}/architecture.json
            ${{ env.ROOTFORM_OUTPUT_DIR }}/init.json
            ${{ env.ROOTFORM_OUTPUT_DIR }}/init.stderr
            ${{ env.ROOTFORM_OUTPUT_DIR }}/build.stderr
            ${{ env.ROOTFORM_OUTPUT_DIR }}/diff.json
            ${{ env.ROOTFORM_OUTPUT_DIR }}/diff.md
            ${{ env.ROOTFORM_OUTPUT_DIR }}/diff.stderr
            ${{ env.ROOTFORM_OUTPUT_DIR }}/check.json
            ${{ env.ROOTFORM_OUTPUT_DIR }}/check.stderr
            ${{ env.ROOTFORM_OUTPUT_DIR }}/check.status
          if-no-files-found: warn
