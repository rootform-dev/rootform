name: Rootform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rootform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rootform-dev/action/setup@1fb6fadcc6356a769d4a1dee34f9563639df60c8
        with:
          version: 0.1.0
          github-token: ${{ github.token }}
      - name: Build and check locked architecture
        run: ./ci/rootform-ci.sh
