stages: [review]

rootform-review:
  stage: review
  variables:
    ROOTFORM_PROJECT: ./infra
    ROOTFORM_OUTPUT_DIR: .rootform-ci-${CI_JOB_ID}
  script:
    - test -w "$CI_PROJECT_DIR"
    - terraform -chdir=infra init -input=false
    - terraform -chdir=infra plan -input=false -out="$CI_PROJECT_DIR/plan.tfplan"
    - terraform -chdir=infra show -json "$CI_PROJECT_DIR/plan.tfplan" > plan.json
    - ROOTFORM_INPUT=plan.json ROOTFORM_PLAN_FILE=plan.tfplan sh ./ci/rootform-ci.sh
  artifacts:
    when: always
    paths:
      - .rootform-ci-*/analysis.json
      - .rootform-ci-*/report.md
      - .rootform-ci-*/results.sarif
      - .rootform-ci-*/summary.txt
      - .rootform-ci-*/run.stderr
      - .rootform-ci-*/run.status
