trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  ROOTFORM_CHECK: '0'

steps:
  - checkout: self
  - bash: |
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --volume "$(Build.SourcesDirectory):/workspace" \
        --workdir /workspace \
        --env HOME=/tmp \
        --env ROOTFORM_HOME=/tmp/rootform-home \
        --env ROOTFORM_PROJECT=./infra \
        --env ROOTFORM_CHECK \
        --env ROOTFORM_POLICY_PACK \
        --env ROOTFORM_OFFLINE \
        ghcr.io/rootform-dev/rootform:0.1.0 \
        sh ./ci/rootform-ci.sh
    displayName: Build architecture with Rootform
  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/.rootform-ci
      artifact: rootform-results
