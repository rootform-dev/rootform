name: publish private image

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact published Rootform release ID
        required: true
        type: string
      version:
        description: Exact Rootform version
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: private-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: qualify and publish exact private image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out publication controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install controller dependencies
        run: bun install --frozen-lockfile

      - name: Download exact published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ROOTFORM_VERSION: ${{ inputs.version }}
        run: |
          bun scripts/download-release.ts \
            --version "$ROOTFORM_VERSION" \
            --release-id "$RELEASE_ID" \
            --output "$RUNNER_TEMP/release" \
            --metadata "$RUNNER_TEMP/release.json"

      - name: Resolve immutable distribution commit
        id: release
        run: |
          set -euo pipefail
          commit="$(jq -r '.target_commit' "$RUNNER_TEMP/release.json")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact release distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.commit }}

      - name: Check out exact official Dialects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rootform-dev/dialects
          ref: 4ae1c22ab8961e90fe59ad20152a1de812258e1e
          path: build/dialects
          token: ${{ secrets.DIALECTS_CONTENTS_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated Docker client
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/docker-config"
          mkdir -p "$config"
          printf 'DOCKER_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"

      - name: Install exact QEMU emulation
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          cache-image: false
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Install exact Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Install exact distribution dependencies
        run: bun install --frozen-lockfile

      - name: Install exact Dialects dependencies
        working-directory: build/dialects
        run: bun install --frozen-lockfile

      - name: Install verified publication tools
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
          GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
          ORAS_ARCHIVE: oras_1.3.4_linux_amd64.tar.gz
          ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
          ORAS_VERSION: 1.3.4
          TRIVY_ARCHIVE: trivy_0.74.0_Linux-64bit.tar.gz
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$GITLEAKS_ARCHIVE"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" --directory "$RUNNER_TEMP" gitleaks
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$ACTIONLINT_ARCHIVE"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" --directory "$RUNNER_TEMP" actionlint
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$ORAS_ARCHIVE" \
            "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/$ORAS_ARCHIVE"
          printf '%s  %s\n' "$ORAS_SHA256" "$RUNNER_TEMP/$ORAS_ARCHIVE" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$ORAS_ARCHIVE" --directory "$RUNNER_TEMP" oras
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$TRIVY_ARCHIVE" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/$TRIVY_ARCHIVE"
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/$TRIVY_ARCHIVE" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$TRIVY_ARCHIVE" --directory "$RUNNER_TEMP" trivy
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify exact private release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          cmp --silent \
            "$RUNNER_TEMP/release/ROOTFORM-BINARY-LICENSE.txt" \
            dependencies/ROOTFORM-BINARY-LICENSE.txt
          bun run check
          actionlint -no-color -oneline
          git diff --check
          gitleaks dir --no-banner --redact --config .gitleaks.toml .
          gitleaks git --no-banner --redact --config .gitleaks.toml .

      - name: Extract verified native qualification binary
        env:
          ROOTFORM_VERSION: ${{ inputs.version }}
        run: |
          bun scripts/extract-release-binary.ts \
            --version "$ROOTFORM_VERSION" \
            --release "$RUNNER_TEMP/release" \
            --target linux-amd64 \
            --output build/bin/rootform

      - name: Build and audit official image
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          ROOTFORM_VERSION: ${{ inputs.version }}
        run: |
          bun scripts/build-image.ts \
            --version "$ROOTFORM_VERSION" \
            --release "$RUNNER_TEMP/release" \
            --revision "$RELEASE_COMMIT" \
            --output build/image

      - name: Qualify runtime before publication
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          ROOTFORM_VERSION: ${{ inputs.version }}
        run: |
          bun scripts/qualify-image.ts \
            --version "$ROOTFORM_VERSION" \
            --revision "$RELEASE_COMMIT" \
            --image build/image \
            --dialects build/dialects \
            --rootform-bin build/bin/rootform \
            --oras "$RUNNER_TEMP/oras" \
            --trivy "$RUNNER_TEMP/trivy" \
            --evidence build/image-evidence/qualification.json

      - name: Verify existing GHCR package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          error="$RUNNER_TEMP/package-before.err"
          if visibility="$(gh api orgs/rootform-dev/packages/container/rootform --jq '.visibility' 2>"$error")"; then
            test "$visibility" = private
          else
            grep -q 'HTTP 404' "$error"
          fi

      - name: Authenticate isolated GHCR client
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DOCKER_CONFIG" == "$RUNNER_TEMP/"* ]]
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish exact version with attestations
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          ROOTFORM_VERSION: ${{ inputs.version }}
        run: |
          bun scripts/publish-image.ts \
            --version "$ROOTFORM_VERSION" \
            --revision "$RELEASE_COMMIT" \
            --context build/image/context \
            --image-manifest "build/image/rootform_${ROOTFORM_VERSION}_image.json" \
            --metadata build/image-evidence/buildx-metadata.json \
            --evidence build/image-evidence/publication.json

      - name: Verify published GHCR package remains private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api orgs/rootform-dev/packages/container/rootform --jq '.visibility')" = private

      - name: Upload publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootform-private-image-${{ inputs.version }}-${{ steps.release.outputs.commit }}
          path: |
            ${{ runner.temp }}/release.json
            build/image/rootform_${{ inputs.version }}_image.json
            build/image-evidence/*.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Remove registry credentials
        if: always()
        run: |
          set -euo pipefail
          config="${DOCKER_CONFIG:-$RUNNER_TEMP/docker-config}"
          if [[ -d "$config" && "$config" == "$RUNNER_TEMP/"* ]]; then
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -f -- "$config/config.json"
          fi
